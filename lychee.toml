# Lychee link-checker config; run via `npm run check:links`.

cache = true
max_cache_age = "375d"
no_progress = true
extensions = ["html"]              # built HTML only
include_fragments = "full"         # check in-page anchors
index_files = ["index.html"]       # resolve Hugo pretty-URL dir links to index.html

exclude = [
  '[?&]link-check=no',                              # opt-out query param
  '/index\.xml$',                                   # rel=alternate RSS links
  '^https?://localhost\b',
  '^mailto:',

  # Docsy page-meta links
  '^https?://github\.com/.*?/.*?/(new|edit)/',            # view/edit-source links
  '^https://github\.com/[^/]+/[^/]+/issues/new',          # per-page "create issue" links
  '^https://github\.com/nspawn/nspawn\.org/commit/',          # per-page provenance links
  '^https://github\.com/nspawn/nspawn\.org/tree/main/content/',

  # The hub is an OCI registry, not a web site: it answers on /v2/ only.
  '^https://hub\.nspawn\.org',

  # freedesktop.org answers 418 to the checker from a CI runner (the systemd manual
  # pages are fine in a browser).
  '^https://www\.freedesktop\.org/',

  # GitHub answers 503 to a rendered Markdown page of a repository requested without
  # a session (its code pages are fine).
  '^https://github\.com/nspawn/nspawn/blob/[^?#]+\.md(#.*)?$',

  # Chat clients: single-page apps whose room fragments cannot be checked.
  '^https://matrix\.to/',
  '^https://web\.libera\.chat/',
]
